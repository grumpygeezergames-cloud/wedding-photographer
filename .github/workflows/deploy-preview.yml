name: Deploy preview (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require playable game
        run: test -s Index.html
      - name: Build mobile game
        run: python3 scripts/build-mobile.py
      - name: Prepare preview artifact
        run: |
          mkdir -p preview
          cp site/index.html preview/index.html
          if [ -d assets ]; then cp -R assets preview/assets; fi
      - uses: actions/upload-artifact@v4
        with:
          name: wedding-photographer-preview
          path: preview/
          retention-days: 14
